server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # HTML y JS: el navegador pregunta siempre si cambiaron
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /config.js  { add_header Cache-Control "no-cache"; }
    location ~* \.(png|jpg|jpeg|svg|ico)$ { expires 7d; }

    # Los servicios ArcGIS de MINAM se piden por el mismo dominio (evita CORS intermitente).
    # El visor usa "/geo" cuando no está en localhost.
    location /geo/ {
        proxy_pass https://geoservidorperu.minam.gob.pe/arcgis/rest/services/;
        proxy_ssl_server_name on;
        proxy_set_header Host geoservidorperu.minam.gob.pe;
        proxy_read_timeout 60s;
    }
}
